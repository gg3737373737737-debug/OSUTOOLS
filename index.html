<style>
:root{--bg:#1a1520;--card:#261e30;--card2:#322840;--text:#f2ecf7;--muted:#a99bb8;--pink:#ff66aa;--blue:#66ccff;--line:#3d3250}
:root[data-theme="light"]{--bg:#f6f1fa;--card:#ffffff;--card2:#efe7f6;--text:#2a2133;--muted:#6f6380;--pink:#e0357f;--blue:#1b7bc4;--line:#ddd1ea}
.theme{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:1rem;line-height:1;padding:0}
.suggest{margin:0;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;font:inherit;font-weight:600}
.suggest:hover{filter:brightness(1.08)}
:root{--overlay:rgba(26,21,32,.8)}
:root[data-theme="light"]{--overlay:rgba(246,241,250,.78)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--overlay),var(--overlay)),url(bg.jpg) center/cover no-repeat}
header,nav,main,footer{position:relative;z-index:1}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.logo-wrap{position:relative;display:inline-flex;width:40px;height:40px;margin-right:10px}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pink);opacity:0;animation:ring 2.8s ease-out infinite;pointer-events:none}
.logo-wrap::after{animation-delay:1.4s}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.4);opacity:0}}
#fq-list details{background:var(--card2);border-radius:12px;margin:8px 0;border:1px solid transparent}
#fq-list details[open]{border-color:var(--pink)}
#fq-list summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
#fq-list summary::-webkit-details-marker{display:none}
#fq-list summary::after{content:"+";color:var(--pink);font-size:1.3rem;line-height:1;flex:none}
#fq-list details[open] summary::after{content:"\2212"}
#fq-list details p{margin:0;padding:0 16px 14px;color:var(--muted);overflow-wrap:anywhere}
#fq-list details a{color:var(--blue)}
.cw{position:relative}
.cw .card{padding-right:82px;height:100%}
.gbtn{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font:700 .85rem/1 inherit;cursor:pointer;padding:0;transition:color .15s,border-color .15s,background .15s}
.gbtn:hover{color:#fff;background:var(--c);border-color:var(--c)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,16,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.open{display:flex}
.mbox{position:relative;width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.mbox h3{margin:0 0 2px;padding-right:32px}
.mbox .mtag{font-size:.8rem;color:var(--pink);margin:0 0 10px}
.mbox ol{padding-left:22px;margin:8px 0 12px}.mbox li{margin:8px 0;overflow-wrap:anywhere}
.mbox .mnote{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.mclose{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:1rem;cursor:pointer;padding:0}
.mgo{display:inline-block;margin-top:6px;background:var(--pink);color:#fff;text-decoration:none;border-radius:999px;padding:8px 18px;font-weight:600}
.cw.in{animation:cardIn .5s ease backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cw.in{animation:none}.logo-wrap::before,.logo-wrap::after{display:none}}
.totop{position:fixed;right:18px;bottom:18px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s,filter .15s;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{filter:brightness(1.1)}
.suggest,.soc,.theme,.lang button,nav button,.filters button,.btns a,.card{transition:transform .12s ease,filter .15s,border-color .15s}
.suggest:active,.soc:active,.theme:active,.lang button:active,nav button:active,.filters button:active,.btns a:active{transform:scale(.94)}
.totop.show:active{transform:scale(.92)}
.card:active{transform:translateX(3px) scale(.98)}
code,.guide li{overflow-wrap:anywhere}
@media (max-width:560px){
  header{padding:64px 12px 12px}

  main{padding:0 12px 32px}
  section{padding:16px}
  .cards{grid-template-columns:1fr}
  .fwrap{gap:28px}
  footer{padding:20px 12px 28px}
  .toast{max-width:90vw;text-align:center}
  .totop{right:12px;bottom:12px}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 16px;text-align:center;position:relative}
h1{margin:0;font-size:2rem;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}h1 span{color:var(--pink)}
.logo{width:40px;height:40px}
header p{margin:4px 0 0;color:var(--muted)}
.lang{position:absolute;top:16px;right:16px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--card);color:var(--muted);border:0;padding:6px 12px;cursor:pointer;font:inherit;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--pink);color:#fff}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 16px}
nav button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit}
nav button.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
section{display:none;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:16px;padding:20px}
section.active{display:block}
.guide ol{padding-left:22px}.guide li{margin:10px 0}
.guide a{color:var(--blue)}
.sub-steps{list-style:decimal;padding-left:20px}
.shot{display:block;max-width:100%;height:auto;margin:8px 0;border-radius:8px;border:1px solid var(--line)}
code{background:var(--card2);border-radius:4px;padding:1px 6px;font-size:.9em}
.guide h3{margin:20px 0 6px}
.warn{background:var(--card2);border-left:4px solid #ffd166;border-radius:8px;padding:10px 14px;margin:14px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns a{background:var(--pink);color:#fff;text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:600}
.btns a.alt{background:var(--card2);color:var(--text)}
h2{margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{background:var(--card2);color:var(--text);border:2px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit;font-weight:600}
.filters button.on{border-color:var(--blue);color:var(--blue)}
#c-search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:inherit}
#c-search:focus{outline:2px solid var(--pink)}
.srow{display:flex;gap:8px;flex-wrap:wrap}.srow #c-search{flex:1 1 220px;width:auto}
#c-sort{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:inherit;cursor:pointer}
#c-sort:focus{outline:2px solid var(--pink)}
.cnt{color:var(--pink);font-size:.9rem;font-weight:600;margin:2px 0 0}
.newb{margin-left:8px;font-size:.68rem;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:1px 8px;text-transform:uppercase;letter-spacing:.03em}
.fbtn{position:absolute;top:50%;right:44px;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.85rem;line-height:1;cursor:pointer;padding:0;transition:color .15s,background .15s,border-color .15s,transform .12s}
.fbtn:hover{color:#e5262f;border-color:#e5262f}
.fbtn.on{color:#fff;background:#e5262f;border-color:#e5262f}
.fbtn:active{transform:translateY(-50%) scale(.9)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.card{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:999px 16px 16px 999px;padding:10px 16px 10px 10px;color:var(--text);text-decoration:none;border:1px solid transparent;transition:transform .15s}
.card:hover{border-color:var(--c);transform:translateX(3px)}
.hc{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#1a1520;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #fff}
.hc::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);opacity:0;transform:scale(1.8)}
.card:hover .hc::after{animation:approach .6s ease-out infinite}
@keyframes approach{0%{opacity:.9;transform:scale(1.8)}100%{opacity:0;transform:scale(1)}}
.ct{min-width:0}
.card b{display:block}
.card p{margin:2px 0 4px;color:var(--muted);font-size:.85rem;line-height:1.3}
.tag{font-size:.72rem;color:var(--c)}
:root[data-theme="light"] .tag{color:color-mix(in srgb,var(--c) 50%,#2a2133);font-weight:600}
footer{max-width:760px;margin:0 auto;padding:24px 16px 32px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.fwrap{display:flex;gap:56px;flex-wrap:wrap;margin-bottom:20px}
.fcol h4{margin:0 0 10px;color:var(--text);font-size:1.05rem}
.fcol a{display:block;color:var(--muted);text-decoration:none;margin:6px 0;font-size:.95rem}
.fcol a:hover{color:var(--text)}
.soc-row{display:flex;align-items:center;gap:10px;color:var(--text)}
.soc{width:50px;height:50px;border-radius:50%;border:0;background:#5865f2;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.soc svg{width:26px;height:26px;fill:#fff}
.fcol a.soc{display:flex;margin:0;text-decoration:none}
.soc.tg{background:#229ed9}
.soc.donate{background:#fff}
.soc.donate svg{fill:#e5262f}
.soc:hover{filter:brightness(1.12)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
#privacy p{margin:6px 0 0}
</style>
</head>

const I18N = {

    title: 'Утилиты', sub: 'Каталог полезных программ и сайтов для игроков и мапперов',

  $('g-steps').innerHTML = t.gSteps.map(x => `<li>${x}</li>`).join('');
  $('g-warn').innerHTML = t.gWarn;
  document.documentElement.lang = lang;
  document.title = t.doc;
  $('t-title').textContent = t.title; $('t-sub').textContent = t.sub;
  $('t-h2').textContent = t.h2; $('t-note').textContent = t.note;
  $('t-foot').textContent = t.foot; $('c-search').placeholder = t.search;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  $('c-filter').innerHTML = '';
  ['all', 'fav', ...Object.keys(t.cats)].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'all' ? t.all : k === 'fav' ? `♥ ${t.favs} (${favs.size})` : t.cats[k];
    if (k === cFilter) b.className = 'on';
    b.onclick = () => { cFilter = k; animCards = true; render(); };
    $('c-filter').appendChild(b);
  });

  const q = cQuery.trim().toLowerCase(), li = lang === 'ru' ? 1 : 2;
  let list = tools.filter(x => (cFilter === 'all' || (cFilter === 'fav' ? favs.has(x[0]) : x[3] === cFilter)) && (!q || (x[0] + ' ' + x[li]).toLowerCase().includes(q)));
  if (cSort === 'az') list = [...list].sort((a, b) => a[0].toLowerCase().localeCompare(b[0].toLowerCase()));
  else if (cSort === 'new') list = [...list].sort((a, b) => NEW.has(b[0]) - NEW.has(a[0]));
  $('c-list').innerHTML = list.map((x, i) =>
    `<div class="cw${animCards ? ' in' : ''}" style="--c:${colors[i % colors.length]};--i:${Math.min(i, 14)}"><a class="card" href="${x[4]}" target="_blank" rel="noopener noreferrer"><span class="hc">${i + 1}</span><span class="ct"><b>${x[0]}</b><p>${x[li]}</p><span class="tag">${t.cats[x[3]]}</span>${NEW.has(x[0]) ? `<span class="newb">${t.newLabel}</span>` : ''}</span></a><button class="fbtn${favs.has(x[0]) ? ' on' : ''}" type="button" data-f="${tools.indexOf(x)}" title="${favs.has(x[0]) ? t.favDel : t.favAdd}" aria-pressed="${favs.has(x[0])}" aria-label="${favs.has(x[0]) ? t.favDel : t.favAdd}: ${x[0]}">♥</button><button class="gbtn" type="button" data-i="${tools.indexOf(x)}" title="${t.gbtn}" aria-label="${t.gbtn}: ${x[0]}">?</button></div>`).join('')
    || `<p class="sub">${t.none}</p>`;
  animCards = false;
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-go]');
  if (a) { e.preventDefault(); go(a.dataset.go); }
});
$('c-search').oninput = e => { cQuery = e.target.value; render(); };
$('c-sort').onchange = e => { cSort = e.target.value; animCards = true; render(); };
document.addEventListener('click', e => {
  const b = e.target.closest('.fbtn');
  if (!b) return;
  e.preventDefault();
  const x = tools[+b.dataset.f]; if (!x) return;
  if (favs.has(x[0])) favs.delete(x[0]); else favs.add(x[0]);
  try { localStorage.setItem('favs', JSON.stringify([...favs])); } catch (err) {}
  render();
});
function copyDiscord(key){
  try { navigator.clipboard.writeText('nexxy34'); } catch (e) {}
  const el = $('toast'); el.textContent = I18N[lang][key]; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
$('f-dc').onclick = () => copyDiscord('copied');
$('suggest').onclick = () => copyDiscord('suggestMsg');

const root = document.documentElement;
const themeIcon = () => $('theme-btn').textContent = root.dataset.theme === 'light' ? '🌙' : '☀️';
$('theme-btn').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  themeIcon();
};
themeIcon();
render();

// ---- окно мини-гайда ----
(function(){
  const m = $('modal');
  function open(i){
    const x = tools[i]; if (!x) return;
    const t = I18N[lang], g = (GUIDES[x[0]] || GENERIC_GUIDE)[lang] || GENERIC_GUIDE[lang];
    $('m-title').textContent = x[0];
    $('m-tag').textContent = t.gHow + ' · ' + t.cats[x[3]];
    $('m-steps').innerHTML = g.map(s => `<li>${s}</li>`).join('');
    $('m-go').href = x[4]; $('m-go').textContent = t.gOpen;
    $('m-note').textContent = t.gNote;
    $('m-close').setAttribute('aria-label', t.gClose);
    m.classList.add('open');
    $('m-close').focus();
  }
  const close = () => m.classList.remove('open');
  document.addEventListener('click', e => {
    const b = e.target.closest('.gbtn');
    if (b) { e.preventDefault(); open(+b.dataset.i); }
  });
  $('m-close').onclick = close;
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();

// ---- кнопка «наверх» ----
(function(){
  const b = $('totop');
  const upd = () => b.classList.toggle('show', window.scrollY > 400);
  window.addEventListener('scroll', upd, { passive: true });
  b.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  upd();
})();

// ---- падающие лепестки сакуры ----
(function(){
  const cv = $('petals');
  if (!cv || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { if (cv) cv.remove(); return; }
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, petals = [], last = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function make(initial){
    return {
      x: rnd(0, W), y: initial ? rnd(-H, H) : rnd(-60, -10),
      s: rnd(5, 11), vy: rnd(22, 48), sw: rnd(14, 38), ph: rnd(0, 6.28), fr: rnd(0.5, 1.4),
      rot: rnd(0, 6.28), vr: rnd(-1.2, 1.2), a: rnd(0.45, 0.85)
    };
  }
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(14, Math.min(34, Math.round(W / 45)));
    while (petals.length < n) petals.push(make(true));
    petals.length = n;
  }
  function draw(p){
    const light = document.documentElement.dataset.theme === 'light';
    ctx.save();
    ctx.translate(p.x + Math.sin(p.ph) * p.sw, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.a;
    ctx.fillStyle = light ? '#f06fa5' : '#ffd3e4';
    const s = p.s;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.95, -s * 0.55, s * 0.8, s * 0.65, 0, s);
    ctx.bezierCurveTo(-s * 0.8, s * 0.65, -s * 0.95, -s * 0.55, 0, -s);
    ctx.fill();
    ctx.restore();
  }
  function frame(t){
    const dt = Math.min((t - last) / 1000 || 0, 0.05); last = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of petals) {
      p.y += p.vy * dt; p.ph += p.fr * dt; p.rot += p.vr * dt;
      if (p.y > H + 20) Object.assign(p, make(false));
      draw(p);
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
