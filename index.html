<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu! Утилиты — каталог программ и сайтов</title>
<meta name="description" content="Каталог лучших программ и сайтов для osu!: скины, реплеи, коллекции карт, статистика, инструменты мапперов и развлечения.">
<meta name="keywords" content="osu, osu!, osu tools, osu утилиты, скины osu, реплеи osu, коллекции osu">
<meta property="og:title" content="osu! Утилиты">
<meta property="og:description" content="Каталог программ и сайтов для osu!">
<meta property="og:type" content="website">
<style>
:root{--bg:#1a1520;--card:#261e30;--card2:#322840;--text:#f2ecf7;--muted:#a99bb8;--pink:#ff66aa;--blue:#66ccff;--line:#3d3250}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 16px;text-align:center;position:relative}
h1{margin:0;font-size:2rem}h1 span{color:var(--pink)}
header p{margin:4px 0 0;color:var(--muted)}
.lang{position:absolute;top:16px;right:16px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--card);color:var(--muted);border:0;padding:6px 12px;cursor:pointer;font:inherit;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--pink);color:#fff}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
section{background:var(--card);border-radius:16px;padding:20px}
h2{margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{background:var(--card2);color:var(--text);border:2px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit;font-weight:600}
.filters button.on{border-color:var(--blue);color:var(--blue)}
#c-search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:inherit}
#c-search:focus{outline:2px solid var(--pink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.card{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:999px 16px 16px 999px;padding:10px 16px 10px 10px;color:var(--text);text-decoration:none;border:1px solid transparent;transition:transform .15s}
.card:hover{border-color:var(--c);transform:translateX(3px)}
.hc{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#1a1520;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #fff}
.hc::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);opacity:0;transform:scale(1.8)}
.card:hover .hc::after{animation:approach .6s ease-out infinite}
@keyframes approach{0%{opacity:.9;transform:scale(1.8)}100%{opacity:0;transform:scale(1)}}
.ct{min-width:0}
.card b{display:block}
.card p{margin:2px 0 4px;color:var(--muted);font-size:.85rem;line-height:1.3}
.tag{font-size:.72rem;color:var(--c)}
footer{text-align:center;color:var(--muted);padding:0 16px 32px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  <h1><span>osu!</span> <span id="t-title" style="color:inherit"></span></h1>
  <p id="t-sub"></p>
</header>
<main>
<section>
  <h2 id="t-h2"></h2>
  <p class="sub" id="t-note"></p>
  <input type="search" id="c-search">
  <div class="filters" id="c-filter"></div>
  <div class="cards" id="c-list"></div>
</section>
</main>
<footer id="t-foot"></footer>

<script>
const $ = id => document.getElementById(id);

const I18N = {
  ru: {
    title: 'Утилиты', sub: 'Каталог полезных программ и сайтов для игроков и мапперов',
    h2: 'Каталог программ и сайтов', note: 'Подборка лучших сторонних инструментов для osu!. Все ссылки ведут на сайты их авторов.',
    search: 'Поиск по каталогу…', all: 'Все', none: 'Ничего не найдено',
    foot: 'Неофициальный проект, не связан с ppy Pty Ltd. osu! — торговая марка ppy.',
    doc: 'osu! Утилиты — каталог программ и сайтов',
    cats: {skins:'Скины', clients:'Клиенты и реплеи', maps:'Карты и коллекции', stats:'Статистика', mapping:'Мапперам', stream:'Стрим и турниры', fun:'Развлечения'}
  },
  en: {
    title: 'Tools', sub: 'A catalog of useful programs and websites for players and mappers',
    h2: 'Programs and websites', note: 'A selection of the best third-party tools for osu!. All links lead to the authors\' sites.',
    search: 'Search the catalog…', all: 'All', none: 'Nothing found',
    foot: 'Unofficial project, not affiliated with ppy Pty Ltd. osu! is a trademark of ppy.',
    doc: 'osu! Tools — catalog of programs and websites',
    cats: {skins:'Skins', clients:'Clients & replays', maps:'Maps & collections', stats:'Statistics', mapping:'For mappers', stream:'Streaming & tournaments', fun:'Fun'}
  }
};

// [название, описание RU, описание EN, категория, ссылка]
const tools = [
  ['skins.osuck', 'Каталог скинов', 'Skin catalog', 'skins', 'https://skins.osuck.net/'],
  ['osu! skins', 'Каталог скинов для osu!', 'Skin catalog for osu!', 'skins', 'https://osuskins.net/'],
  ['skinhub', 'Проект для работы со скинами (GitHub)', 'A project for working with skins (GitHub)', 'skins', 'https://github.com/ryancranie/skinhub'],

  ['McOsu', 'Клиент osu! на C++ с необычными фишками', 'An osu! client written in C++ with unique features', 'clients', 'https://store.steampowered.com/app/607260/McOsu/'],
  ['neomod', 'Альтернативный клиент osu!', 'An alternative osu! client', 'clients', 'https://neomod.net/'],
  ['danser', 'Рендер реплеев с красивыми эффектами', 'Replay renderer with fancy effects', 'clients', 'https://github.com/Wieku/danser-go'],
  ['o!rdr', 'Онлайн-рендер реплеев в видео', 'Online replay-to-video renderer', 'clients', 'https://ordr.issou.best/'],
  ['rewind', 'Просмотр и анализ реплеев', 'Replay viewer and analyzer', 'clients', 'https://github.com/abstrakt8/rewind'],

  ['osu!collector', 'Пользовательские коллекции карт', 'Community-made beatmap collections', 'maps', 'https://osucollector.com/'],
  ['Collection Manager', 'Управление коллекциями карт в osu!', 'Manage your osu! beatmap collections', 'maps', 'https://github.com/Piotrekol/CollectionManager'],
  ['Collection Helper', 'Помощник для работы с коллекциями', 'A helper for working with collections', 'maps', 'https://github.com/nzbasic/Collection-Helper'],
  ['osu-pps', 'Поиск «фармилок» — карт, выгодных по PP', 'Find PP farm maps', 'maps', 'https://osu-pps.com/#/osu/maps'],
  ['osu!farmer', 'Подбор карт для фарма PP', 'Map picks for PP farming', 'maps', 'https://www.osufarmer.com/'],
  ['Tillerino', 'Бот в osu! для подбора карт под фарм', 'In-game bot that recommends maps to farm', 'maps', 'https://osu.ppy.sh/users/2070907'],
  ['omdb', 'База данных и оценки карт', 'Beatmap database and ratings', 'maps', 'https://omdb.nyahh.net/'],

  ['Score Inspector', 'Подробная статистика скоров и профиля', 'Detailed score and profile statistics', 'stats', 'https://github.com/darkchii/score-inspector'],
  ['osu! expert+', 'Дополнительная статистика и анализ', 'Extra statistics and analysis', 'stats', 'https://github.com/inix1257'],
  ['osu!skills', 'Оценка навыков игрока', 'Player skill evaluation', 'stats', 'https://osuskills.com/'],
  ['circle-tracker', 'Запись твоих игр в документ и анализ', 'Records your plays to a document for analysis', 'stats', 'https://github.com/FunOrange/circle-tracker'],
  ['Mutualify', 'Просмотр мутуалов (взаимных подписок)', 'See your mutual follows', 'stats', 'https://mutualify.stanr.info/'],

  ['osucad', 'Онлайн-редактор карт', 'Online beatmap editor', 'mapping', 'https://osucad.com/'],
  ['o!mt (Mapping Tools)', 'Набор инструментов для маппинга', 'A toolkit for mapping', 'mapping', 'https://mappingtools.github.io/'],
  ['osu! trainer', 'Изменение параметров карты', 'Change beatmap parameters', 'mapping', 'https://github.com/FunOrange/osu-trainer'],

  ['tosu', 'Виджеты для OBS и стримов по osu!', 'OBS widgets for osu! streams', 'stream', 'https://tosu.app/'],
  ['Ronnia bot', 'Бот для запросов карт на стриме', 'Bot for map requests on stream', 'stream', 'https://ronnia.me/login'],
  ['osu team sheets', 'Таблицы команд для турниров', 'Team sheets for tournaments', 'stream', 'https://osusheets.team/'],

  ['osu! gacha', 'Открытие карточек с игроками osu!', 'Open cards of osu! players', 'fun', 'https://gacha.miz.to/'],
  ['osu! PP casino', 'Казино на PP', 'A PP casino', 'fun', 'https://casino.osutools.cc/'],
  ['RankGuessr', 'Игра «угадай ранг»', 'A "guess the rank" game', 'fun', 'https://rankguessr.app/'],
  ['osu! Music Quiz (Luscent)', 'Музыкальная викторина по osu!', 'An osu! music quiz', 'fun', 'https://osumusicquiz.com/'],
  ['osu! Music Quiz (HyperBCS)', 'Музыкальная викторина по osu!', 'An osu! music quiz', 'fun', 'https://omq.bcs.dev/app']
];
const colors = ['#ff66aa', '#66ccff', '#b3e86f', '#ffd166', '#c792ff', '#ff8a5c'];

let saved = null;
try { saved = localStorage.getItem('lang'); } catch (e) {}
let lang = saved in I18N ? saved : ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
let cFilter = 'all', cQuery = '';

function render(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.doc;
  $('t-title').textContent = t.title; $('t-sub').textContent = t.sub;
  $('t-h2').textContent = t.h2; $('t-note').textContent = t.note;
  $('t-foot').textContent = t.foot; $('c-search').placeholder = t.search;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  $('c-filter').innerHTML = '';
  ['all', ...Object.keys(t.cats)].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'all' ? t.all : t.cats[k];
    if (k === cFilter) b.className = 'on';
    b.onclick = () => { cFilter = k; render(); };
    $('c-filter').appendChild(b);
  });

  const q = cQuery.trim().toLowerCase(), li = lang === 'ru' ? 1 : 2;
  const list = tools.filter(x => (cFilter === 'all' || x[3] === cFilter) && (!q || (x[0] + ' ' + x[li]).toLowerCase().includes(q)));
  $('c-list').innerHTML = list.map((x, i) =>
    `<a class="card" href="${x[4]}" target="_blank" rel="noopener noreferrer" style="--c:${colors[i % colors.length]}"><span class="hc">${i + 1}</span><span class="ct"><b>${x[0]}</b><p>${x[li]}</p><span class="tag">${t.cats[x[3]]}</span></span></a>`).join('')
    || `<p class="sub">${t.none}</p>`;
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
});
$('c-search').oninput = e => { cQuery = e.target.value; render(); };
render();
</script>
</body>
</html>
