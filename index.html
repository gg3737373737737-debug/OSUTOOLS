<meta charset="utf-8">

<title>osu! Утилиты — каталог программ и сайтов</title>
<meta name="description" content="Каталог лучших программ и сайтов для osu!: скины, реплеи, коллекции карт, статистика, инструменты мапперов и развлечения.">
<meta name="keywords" content="osu, osu!, osu tools, osu утилиты, скины osu, реплеи osu, коллекции osu">

<meta property="og:description" content="Каталог программ и сайтов для osu!">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{--bg:#1a1520;--card:#261e30;--card2:#322840;--text:#f2ecf7;--muted:#a99bb8;--pink:#ff66aa;--blue:#66ccff;--line:#3d3250}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 16px;text-align:center;position:relative}
h1{margin:0;font-size:2rem}h1 span{color:var(--pink)}
header p{margin:4px 0 0;color:var(--muted)}
.lang{position:absolute;top:16px;right:16px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:var(--card);color:var(--muted);border:0;padding:6px 12px;cursor:pointer;font:inherit;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--pink);color:#fff}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 16px}
nav button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit}
nav button.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
section{display:none;background:var(--card);border-radius:16px;padding:20px}
section.active{display:block}
.guide ol{padding-left:22px}.guide li{margin:10px 0}
.guide a{color:var(--blue)}
.sub-steps{list-style:decimal;padding-left:20px}
.shot{display:block;max-width:100%;height:auto;margin:8px 0;border-radius:8px;border:1px solid var(--line)}
code{background:var(--card2);border-radius:4px;padding:1px 6px;font-size:.9em}
.guide h3{margin:20px 0 6px}
.warn{background:var(--card2);border-left:4px solid #ffd166;border-radius:8px;padding:10px 14px;margin:14px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns a{background:var(--pink);color:#fff;text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:600}
.btns a.alt{background:var(--card2);color:var(--text)}
h2{margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{background:var(--card2);color:var(--text);border:2px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit;font-weight:600}
.filters button.on{border-color:var(--blue);color:var(--blue)}
#c-search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font:inherit}
#c-search:focus{outline:2px solid var(--pink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.card{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:999px 16px 16px 999px;padding:10px 16px 10px 10px;color:var(--text);text-decoration:none;border:1px solid transparent;transition:transform .15s}
.card:hover{border-color:var(--c);transform:translateX(3px)}
.hc{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#1a1520;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #fff}
.hc::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);opacity:0;transform:scale(1.8)}
.card:hover .hc::after{animation:approach .6s ease-out infinite}
@keyframes approach{0%{opacity:.9;transform:scale(1.8)}100%{opacity:0;transform:scale(1)}}
.ct{min-width:0}
.card b{display:block}
.card p{margin:2px 0 4px;color:var(--muted);font-size:.85rem;line-height:1.3}
.tag{font-size:.72rem;color:var(--c)}
footer{text-align:center;color:var(--muted);padding:0 16px 32px;font-size:.85rem}
</style>
</head>

  <p id="t-sub"></p>

  <button data-t="cat" id="n-cat"></button>
  <button data-t="guide" id="n-guide"></button>

  <ul id="g-feat"></ul>
  <h3 id="g-st"></h3>
  <ol id="g-steps"></ol>
  <div class="warn" id="g-warn"></div>
  <div id="dev">

    <ol id="d-steps"></ol>

  </div>

<section id="cat">
  <h2 id="t-h2"></h2>
  <p class="sub" id="t-note"></p>
  <input type="search" id="c-search">
  <div class="filters" id="c-filter"></div>
  <div class="cards" id="c-list"></div>
</section>
</main>
<footer id="t-foot"></footer>

let cFilter = 'all', cQuery = '';
const TABS = ['cat', 'guide'];
let tab = ['guide', 'dev'].includes(location.hash.slice(1)) ? 'guide' : 'cat';
function go(t){
  const toDev = t === 'dev';
  tab = toDev ? 'guide' : t;
  try { history.replaceState(null, '', tab === 'cat' ? location.pathname : '#guide'); } catch (e) {}
  render();
  if (toDev) $('dev').scrollIntoView({ behavior: 'smooth' }); else window.scrollTo(0, 0);
}

function render(){
  const t = I18N[lang];
  $('n-cat').textContent = t.tabCat; $('n-guide').textContent = t.tabGuide;  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
  TABS.forEach(k => $(k).classList.toggle('active', tab === k));
  $('d-h2').textContent = t.dH2; $('d-intro').textContent = t.dIntro;
  $('d-bt').textContent = t.dBt;
  $('d-steps').innerHTML = t.dSteps.map(x => `<li>${x}</li>`).join('');
  $('d-br').innerHTML = t.dBr.map(x => `<li>${x}</li>`).join('');
  $('d-warn').innerHTML = t.dWarn;
  $('g-h2').textContent = t.gH2; $('g-intro').textContent = t.gIntro;
  $('g-btns').innerHTML = `<a href="https://osu.ppy.sh/community/forums/topics/408541?n=1" target="_blank" rel="noopener noreferrer">${t.gBtn1}</a><a href="https://github.com/limjeck/osuplus/raw/master/osuplus.user.js" target="_blank" rel="noopener noreferrer">${t.gBtn2}</a><a class="alt" href="https://github.com/limjeck/osuplus" target="_blank" rel="noopener noreferrer">${t.gBtn3}</a>`;
  $('g-ft').textContent = t.gFt; $('g-st').textContent = t.gSt;
  $('g-feat').innerHTML = t.gFeat.map(x => `<li>${x}</li>`).join('');
  $('g-steps').innerHTML = t.gSteps.map(x => `<li>${x}</li>`).join('');
  $('g-warn').innerHTML = t.gWarn;
  document.documentElement.lang = lang;
  document.title = t.doc;
  $('t-title').textContent = t.title; $('t-sub').textContent = t.sub;
  $('t-h2').textContent = t.h2; $('t-note').textContent = t.note;
  $('t-foot').textContent = t.foot; $('c-search').placeholder = t.search;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  $('c-filter').innerHTML = '';
  ['all', ...Object.keys(t.cats)].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'all' ? t.all : t.cats[k];
    if (k === cFilter) b.className = 'on';
    b.onclick = () => { cFilter = k; render(); };
    $('c-filter').appendChild(b);
  });

  const q = cQuery.trim().toLowerCase(), li = lang === 'ru' ? 1 : 2;
  const list = tools.filter(x => (cFilter === 'all' || x[3] === cFilter) && (!q || (x[0] + ' ' + x[li]).toLowerCase().includes(q)));
  $('c-list').innerHTML = list.map((x, i) =>
    `<a class="card" href="${x[4]}" target="_blank" rel="noopener noreferrer" style="--c:${colors[i % colors.length]}"><span class="hc">${i + 1}</span><span class="ct"><b>${x[0]}</b><p>${x[li]}</p><span class="tag">${t.cats[x[3]]}</span></span></a>`).join('')
    || `<p class="sub">${t.none}</p>`;
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-go]');
  if (a) { e.preventDefault(); go(a.dataset.go); }
});
$('c-search').oninput = e => { cQuery = e.target.value; render(); };
render();
</script>
</body>
</html>
